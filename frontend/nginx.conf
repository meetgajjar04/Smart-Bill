server {
  listen 80;
  server_tokens off;
  # The application accepts 15 MB. Leave 1 MB for multipart boundaries and headers.
  client_max_body_size 16m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

  # n8n-only endpoints are never reachable from the browser.
  location /api/internal/ { return 404; }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Accel-Buffering no;
    # Local CPU-only models can take minutes. Keep nginx in step with OLLAMA_TIMEOUT.
    proxy_connect_timeout 10s;
    proxy_send_timeout 360s;
    proxy_read_timeout 360s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
